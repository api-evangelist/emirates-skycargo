name: Emirates SkyCargo
kind: company
description: >-
  Emirates SkyCargo is the air cargo division of Emirates Airline, headquartered
  at Dubai International Airport in the United Arab Emirates, moving general freight,
  pharmaceuticals, perishables, live animals, valuables, mail and courier traffic across
  a network of more than 140 destinations on six continents using both freighters and
  passenger-aircraft bellyhold capacity. In the shipment chain it is the airborne carrier
  leg sitting between the freight forwarder and the ground handler, and it books almost
  exclusively through intermediaries rather than shippers directly. Its API posture is
  advertised but not published: Emirates SkyCargo states on its own Digital Booking
  Channels page that it offers "a direct API connection to your in-house system" covering
  booking creation, amendments, cancellations and track and trace, yet there is no
  developer portal, no API reference, no OpenAPI or AsyncAPI document, no base URL and
  no self-serve signup anywhere on skycargo.com. Access is obtained only by emailing
  SkyCargoAPISupport@emirates.com to negotiate a host-to-host connection, by integrating
  through the CargoWise transport management system, by submitting Freight Forwarding
  Requests over EDI, or by booking through the WebCargo, CargoAi, Pelicargo and cargo.one
  marketplaces, which themselves require IATA/CASS accreditation. The one standard the
  organization documents on its own surface is IATA e-AWB: agents must sign the IATA
  Multilateral e-AWB Agreement before submitting FWB and FHL cargo messages over EDI
  messaging. This is an EDI-and-bilateral-integration carrier with a customer-contract
  portal veneer, not a public API provider.
