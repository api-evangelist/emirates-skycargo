apis:
- aid: emirates-skycargo:emirates-skycargo-host-to-host-api
  name: Emirates SkyCargo Host-to-Host API
  description: >-
    A direct system-to-system API that Emirates SkyCargo advertises on its
    own Digital Booking Channels page, described as connecting a freight forwarder's
    in-house system for real-time instant booking confirmation 24/7, with booking
    creation, amendments, cancellations and track and trace. No technical contract is
    published — there is no developer portal, no API reference, no machine-readable
    specification, no documented base URL, no authentication documentation and no
    self-serve onboarding. The only published route to access is an email to
    SkyCargoAPISupport@emirates.com with the subject "Host to Host Connection Via API",
    which starts a commercial integration project. Listed here because the organization
    publicly asserts the API exists and names its capabilities, not because a callable
    contract was found.
  humanURL: https://www.skycargo.com/my-shipments/digital-booking-channels/
