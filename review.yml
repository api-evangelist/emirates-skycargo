sources:
- url: https://www.skycargo.com/my-shipments/digital-booking-channels/
  type: Documentation
  note: Primary evidence. Names the direct API connection and its capabilities, the
    CargoWise TMS lane, the FFR-over-EDI lane, and the WebCargo/CargoAi/Pelicargo/cargo.one
    marketplace lane gated on IATA/CASS membership. All three technical lanes route to
    mailto:SkyCargoAPISupport@emirates.com.
- url: https://www.skycargo.com/my-shipments/e-awb/
  type: Documentation
  note: Primary evidence for standard conformance. IATA e-Freight Programme, IATA
    Multilateral e-AWB (MeA) Agreement mandatory, e-AWB Configuration Form, Activation
    Notice, FWB/FHL over EDI messaging.
- url: https://www.skycargo.com/media-centre/emirates-skycargo-charts-flightpath-into-2026--following-a-milestone-year/
  type: Blog
  note: 'First-party claim: "almost 80% of all shipments on Emirates SkyCargo are booked
    digitally", driven by eSkyCargo, then third-party marketplaces and direct customer
    API integrations.'
- url: https://eskycargo.emirates.com/app/offerandorder/
  type: Portal
  note: The transactional customer surface. Login-gated SPA on a vendor cargo platform.
- url: https://www.cargo.one/partners/ek
  type: Reference
  note: Third-party marketplace listing. Confirms registration keyed on IATA CASS number
    for contract rates and allotments; no API access exposed to the forwarder.
- url: https://www.aircargonews.net/db-schenker-continues-to-expand-airline-api-connections/1069920.article
  type: Reference
  note: Trade press on the DB Schenker host-to-host API connection — bilateral, not open.

actions:
  apisYmlCreated: true
  apisListed: 1
  apisListedNote: One entry, the advertised host-to-host API, listed because Emirates
    SkyCargo publicly asserts its existence and names its capabilities on its own site.
    No baseURL is claimed because none is published. No specification is claimed because
    none exists.
  openapiHarvested: false
  status: built-stub
  reason: |
    Identity and integration posture were captured in full from first-party sources, but
    no public developer surface and no machine-readable contract exist to build on. The
    finding is the point: a top-tier global air cargo carrier that books ~80% digitally,
    that was an early IATA e-freight adopter, and that runs live API connections with DB
    Schenker, Kuehne+Nagel and four marketplaces, publishes exactly zero callable contract
    and requires a signed IATA agreement plus an email negotiation before any counterparty
    can exchange a single message.
